<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330" role="img" aria-label="提交前整理仓库的六步：清、正、补、验、锁、点，顺序不可颠倒">
  <rect width="1100" height="330" fill="#ffffff"/>

  <text x="30" y="44" font-family="sans-serif" font-size="24" font-weight="700" fill="#111827">提交前的六步：顺序不能反</text>
  <text x="30" y="70" font-family="sans-serif" font-size="13.5" fill="#6b7280">先写文档再删东西，删完路径全变，文档全废。所以顺序是固定的：清 → 正 → 补 → 验 → 锁 → 点。</text>

  <!-- 六步 -->
  <g font-family="sans-serif">
    <!-- 1 -->
    <rect x="30" y="96" width="160" height="134" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="46" y="124" font-size="11" fill="#f87171" font-weight="700">01</text>
    <text x="46" y="150" font-size="16" font-weight="700" fill="#991b1b">清</text>
    <text x="46" y="174" font-size="11.5" fill="#7f1d1d">删密钥、日志、</text>
    <text x="46" y="192" font-size="11.5" fill="#7f1d1d">大文件、内网地址</text>
    <text x="46" y="208" font-size="10.5" fill="#b91c1c">先做这步，后面才干净</text>

    <!-- 2 -->
    <rect x="205" y="96" width="160" height="134" rx="8" fill="#fffbeb" stroke="#fde68a"/>
    <text x="221" y="124" font-size="11" fill="#f59e0b" font-weight="700">02</text>
    <text x="221" y="150" font-size="16" font-weight="700" fill="#92400e">正</text>
    <text x="221" y="174" font-size="11.5" fill="#a16207">改掉占位符、</text>
    <text x="221" y="192" font-size="11.5" fill="#a16207">旧路径、错的名字</text>
    <text x="221" y="208" font-size="10.5" fill="#b45309">搜 example / your- 残留</text>

    <!-- 3 -->
    <rect x="380" y="96" width="160" height="134" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="396" y="124" font-size="11" fill="#60a5fa" font-weight="700">03</text>
    <text x="396" y="150" font-size="16" font-weight="700" fill="#1e40af">补</text>
    <text x="396" y="174" font-size="11.5" fill="#1e3a8a">补 README、怎么跑、</text>
    <text x="396" y="192" font-size="11.5" fill="#1e3a8a">项目结构、已知边界</text>
    <text x="396" y="208" font-size="10.5" fill="#1d4ed8">路径以「清」之后为准</text>

    <!-- 4 -->
    <rect x="555" y="96" width="160" height="134" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="571" y="124" font-size="11" fill="#a78bfa" font-weight="700">04</text>
    <text x="571" y="150" font-size="16" font-weight="700" fill="#4c1d95">验</text>
    <text x="571" y="174" font-size="11.5" fill="#5b21b6">clone 到干净目录，</text>
    <text x="571" y="192" font-size="11.5" fill="#5b21b6">照 README 跑一遍</text>
    <text x="571" y="208" font-size="10.5" fill="#6d28d9">唯一诚实的检查</text>

    <!-- 5 -->
    <rect x="730" y="96" width="160" height="134" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="746" y="124" font-size="11" fill="#4ade80" font-weight="700">05</text>
    <text x="746" y="150" font-size="16" font-weight="700" fill="#166534">锁</text>
    <text x="746" y="174" font-size="11.5" fill="#15803d">打 tag、建 release</text>
    <text x="746" y="192" font-size="11.5" fill="#15803d">分支、封口不再改</text>
    <text x="746" y="208" font-size="10.5" fill="#059669">留下可回滚的那个点</text>

    <!-- 6 -->
    <rect x="905" y="96" width="160" height="134" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="921" y="124" font-size="11" fill="#94a3b8" font-weight="700">06</text>
    <text x="921" y="150" font-size="16" font-weight="700" fill="#0f172a">点</text>
    <text x="921" y="174" font-size="11.5" fill="#334155">无痕窗口 + 手机 4G</text>
    <text x="921" y="192" font-size="11.5" fill="#334155">点开每一个链接</text>
    <text x="921" y="208" font-size="10.5" fill="#475569">评委就是这么点的</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#cbd5e1" stroke-width="1.5" fill="#cbd5e1">
    <line x1="192" y1="159" x2="201" y2="159"/><polygon points="199,155 205,159 199,163"/>
    <line x1="367" y1="159" x2="376" y2="159"/><polygon points="374,155 380,159 374,163"/>
    <line x1="542" y1="159" x2="551" y2="159"/><polygon points="549,155 555,159 549,163"/>
    <line x1="717" y1="159" x2="726" y2="159"/><polygon points="724,155 730,159 724,163"/>
    <line x1="892" y1="159" x2="901" y2="159"/><polygon points="899,155 905,159 899,163"/>
  </g>

  <rect x="30" y="244" width="1035" height="56" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="46" y="266" font-family="sans-serif" font-size="12.5" fill="#374151">实测里最常见的三种丢分，全在「点」这一步被发现的：<tspan font-weight="700" fill="#991b1b">源码链接是 example 占位符（404）</tspan> · <tspan font-weight="700" fill="#991b1b">体验地址解析到内网 10.x</tspan> · <tspan font-weight="700" fill="#991b1b">图片签名 54 分钟后过期</tspan>。</text>
  <text x="46" y="288" font-family="sans-serif" font-size="12.5" fill="#374151">产品分是评委给的，机械分是自己丢的。</text>
</svg>
