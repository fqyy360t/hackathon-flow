<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="一次对话里 skill 如何被取用：你说一句话，它按阶段读一份详规，往仓库里写文件">
  <rect width="1200" height="560" fill="#ffffff"/>

  <text x="48" y="50" font-family="sans-serif" font-size="25" font-weight="700" fill="#111827">它到底怎么用：你说一句话，它按阶段取用</text>
  <text x="48" y="80" font-family="sans-serif" font-size="14" fill="#6b7280">你不用记命令、不用挑文件。它先判断你处在哪一步，再只读那一步需要的一份详规。</text>

  <!-- 列 1 -->
  <rect x="48" y="112" width="330" height="356" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="70" y="142" font-family="sans-serif" font-size="13" font-weight="700" fill="#111827">① 你说一句话</text>

  <g font-family="sans-serif" font-size="12.5">
    <rect x="68" y="160" width="290" height="52" rx="8" fill="#ffffff" stroke="#d1d5db"/>
    <text x="82" y="182" fill="#1f2937">我要打这个赛，只有一条链接：</text>
    <text x="82" y="200" fill="#2563eb">https://…</text>

    <rect x="68" y="226" width="290" height="52" rx="8" fill="#ffffff" stroke="#d1d5db"/>
    <text x="82" y="248" fill="#1f2937">24 小时现场赛，</text>
    <text x="82" y="266" fill="#1f2937">时间该怎么排？</text>

    <rect x="68" y="292" width="290" height="52" rx="8" fill="#ffffff" stroke="#d1d5db"/>
    <text x="82" y="314" fill="#1f2937">提交前帮我把仓库查一遍，</text>
    <text x="82" y="332" fill="#1f2937">链接和占位符都过一遍。</text>

    <rect x="68" y="358" width="290" height="76" rx="8" fill="#ffffff" stroke="#d1d5db"/>
    <text x="82" y="380" fill="#1f2937">我拿到评分表了，</text>
    <text x="82" y="398" fill="#1f2937">要改哪部分？</text>
    <text x="82" y="420" font-size="11" fill="#9ca3af">→ 这类问题它都有对应打法</text>
  </g>

  <text x="213" y="452" font-family="sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">说人话就行，不用念文件名</text>

  <!-- 箭头 1 -->
  <g stroke="#9ca3af" stroke-width="1.6" fill="#9ca3af">
    <line x1="378" y1="290" x2="412" y2="290"/>
    <polygon points="412,285 422,290 412,295"/>
  </g>

  <!-- 列 2 -->
  <rect x="426" y="112" width="360" height="356" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="448" y="142" font-family="sans-serif" font-size="13" font-weight="700" fill="#111827">② 它按阶段取用</text>

  <rect x="446" y="158" width="320" height="46" rx="8" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="460" y="178" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#4c1d95">SKILL.md　常驻</text>
  <text x="460" y="195" font-family="sans-serif" font-size="11" fill="#5b21b6">四条铁律 · 主流程 · 四道门 · 67 条反模式</text>

  <text x="606" y="224" font-family="sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">判断「现在在哪一步」↓ 只读一份</text>

  <g font-family="sans-serif" font-size="12">
    <rect x="446" y="236" width="320" height="30" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
    <text x="460" y="256" fill="#4c1d95" font-weight="700">references/13 输入解析</text>
    <text x="700" y="256" fill="#9ca3af" text-anchor="end">刚拿到链接</text>

    <rect x="446" y="272" width="320" height="30" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="460" y="292" fill="#374151">references/00 时间轴与门禁</text>
    <text x="700" y="292" fill="#9ca3af" text-anchor="end">排日程</text>

    <rect x="446" y="308" width="320" height="30" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="460" y="328" fill="#374151">references/14 仓库与远程</text>
    <text x="700" y="328" fill="#9ca3af" text-anchor="end">建远程 / 协作</text>

    <rect x="446" y="344" width="320" height="30" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="460" y="364" fill="#374151">references/15 提交整理</text>
    <text x="700" y="364" fill="#9ca3af" text-anchor="end">交稿前</text>
  </g>
  <text x="606" y="392" font-family="sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">另外 14 份，此刻不读（省上下文）</text>

  <rect x="446" y="404" width="320" height="46" rx="8" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="460" y="424" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#4c1d95">assets/ 41 个模板</text>
  <text x="460" y="441" font-family="sans-serif" font-size="11" fill="#6b7280">复制进你的项目，不临场重新发明</text>

  <!-- 箭头 2 -->
  <g stroke="#9ca3af" stroke-width="1.6" fill="#9ca3af">
    <line x1="786" y1="290" x2="820" y2="290"/>
    <polygon points="820,285 830,290 820,295"/>
  </g>

  <!-- 列 3 -->
  <rect x="834" y="112" width="318" height="356" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="856" y="142" font-family="sans-serif" font-size="13" font-weight="700" fill="#111827">③ 你的仓库里多出这些</text>

  <g font-family="sans-serif" font-size="11.5">
    <g fill="#166534">
      <text x="856" y="170">你的项目/</text>
      <text x="856" y="192">├── AGENTS.md</text>
      <text x="856" y="214" font-weight="700">├── flow/</text>
      <text x="874" y="236">├── 进展.md</text>
      <text x="874" y="258">├── decisions.md</text>
      <text x="874" y="280">└── 未认领.md</text>
      <text x="856" y="302" font-weight="700">├── docs/</text>
      <text x="874" y="324">├── product/</text>
      <text x="874" y="346">└── architecture/</text>
      <text x="856" y="368">├── materials/</text>
      <text x="856" y="390">└── .githooks/</text>
    </g>
    <g fill="#4b5563">
      <text x="1012" y="192">给下一棒的合同</text>
      <text x="1012" y="214">推进项目</text>
      <text x="1012" y="236">★ 交接棒（顶部）</text>
      <text x="1012" y="258">拍板与否决方案</text>
      <text x="1012" y="280">没人做的事</text>
      <text x="1012" y="302">给人读的内容</text>
      <text x="1012" y="324">赛程卡·赛道盘点</text>
      <text x="1012" y="346">评分映射·项目结构</text>
      <text x="1012" y="368">能直接交的东西</text>
      <text x="1012" y="390">拦住直推 main</text>
    </g>
  </g>

  <rect x="856" y="410" width="274" height="44" rx="8" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="870" y="429" font-family="sans-serif" font-size="11.5" fill="#166534">给的是填空骨架，不是范文。</text>
  <text x="870" y="446" font-family="sans-serif" font-size="11.5" fill="#166534">它替你记住「该有哪些格子」，内容还是你写。</text>

  <!-- 底部 -->
  <rect x="48" y="490" width="1104" height="52" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="68" y="513" font-family="sans-serif" font-size="13" font-weight="700" fill="#92400e">换人 / 换模型接手时，它读的是第 ③ 列里的文件 —— 不是你们的聊天记录。</text>
  <text x="68" y="532" font-family="sans-serif" font-size="12" fill="#a16207">这就是为什么每一步都要落到文件里：agent 之间没有对话通道，文件是唯一的连接。</text>
</svg>
