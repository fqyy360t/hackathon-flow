<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" width="1000" height="530" role="img" aria-label="黑客松全流程路线图：十九份详规分五个阶段（拿到链接 / 准备期 / 开赛后 / 收口 / 赛后），另有四份横贯全程">
  <rect width="1000" height="530" fill="#ffffff"/>

  <text x="32" y="42" font-family="sans-serif" font-size="23" font-weight="700" fill="#111827">十九份详规，一张路线图</text>
  <text x="32" y="68" font-family="sans-serif" font-size="12.5" fill="#6b7280">从拿到一条链接，到赛后变成下一场的资产。五段按时间走，最后一条虚线框是全程随时会用到的四份。</text>
  <text x="968" y="66" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#9ca3af" text-anchor="end">4 + 5 + 2 + 3 + 1 + 4 = 19</text>

  <!-- 时间轴 -->
  <line x1="32" y1="104" x2="966" y2="104" stroke="#d1d5db" stroke-width="2"/>
  <polygon points="966,99 976,104 966,109" fill="#d1d5db"/>

  <!-- ===== 1 拿到链接 ===== -->
  <g font-family="sans-serif">
    <circle cx="120" cy="104" r="13" fill="#2563eb"/>
    <text x="120" y="109" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <rect x="32" y="120" width="176" height="280" rx="11" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="42" y="175" font-size="14" font-weight="700" fill="#111827">拿到链接</text>
    <text x="42" y="193" font-size="10.5" fill="#6b7280">当天 · 还没决定打不打</text>
    <text x="42" y="219" font-size="12" fill="#1f2937"><tspan font-weight="700" fill="#2563eb">13</tspan><tspan dx="6">输入解析</tspan></text>
    <text x="42" y="243" font-size="12" fill="#1f2937"><tspan font-weight="700" fill="#2563eb">08</tspan><tspan dx="6">赛道与组队</tspan></text>
    <text x="42" y="267" font-size="12" fill="#1f2937"><tspan font-weight="700" fill="#2563eb">00</tspan><tspan dx="6">时间轴门禁</tspan></text>
    <text x="42" y="291" font-size="12" fill="#1f2937"><tspan font-weight="700" fill="#2563eb">01</tspan><tspan dx="6">逆向工程</tspan></text>
    <text x="42" y="319" font-size="10.5" fill="#1d4ed8">→ 赛程卡 · 赛道盘点</text>
    <text x="42" y="335" font-size="10.5" fill="#1d4ed8">→ 每个赛道背后：谁在出题</text>
    <text x="42" y="351" font-size="10.5" fill="#1d4ed8">→ 它自己要解决的痛点</text>
    <text x="42" y="367" font-size="10.5" fill="#1d4ed8">→ 一句能对外说的题</text>
  </g>

  <!-- ===== 2 准备期 ===== -->
  <g font-family="sans-serif">
    <circle cx="311" cy="104" r="13" fill="#7c3aed"/>
    <text x="311" y="109" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <rect x="223" y="120" width="176" height="280" rx="11" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="233" y="163" font-size="14" font-weight="700" fill="#111827">准备期</text>
    <text x="233" y="181" font-size="10.5" fill="#6b7280">P 天 · L 档约三周</text>
    <text x="233" y="207" font-size="12" fill="#1f2937"><tspan font-weight="700" fill="#7c3aed">02</tspan><tspan dx="6">调研·用户·商业</tspan></text>
    <text x="233" y="231" font-size="12" fill="#1f2937"><tspan font-weight="700" fill="#7c3aed">03</tspan><tspan dx="6">论证预赛</tspan></text>
    <text x="233" y="255" font-size="12" fill="#1f2937"><tspan font-weight="700" fill="#7c3aed">04</tspan><tspan dx="6">Agent 架构</tspan></text>
    <text x="233" y="279" font-size="12" fill="#1f2937"><tspan font-weight="700" fill="#7c3aed">09</tspan><tspan dx="6">工程管理</tspan></text>
    <text x="233" y="303" font-size="12" fill="#1f2937"><tspan font-weight="700" fill="#7c3aed">14</tspan><tspan dx="6">仓库与远程</tspan></text>
    <text x="233" y="335" font-size="10.5" fill="#6d28d9">→ 证据包 · 画像 · 定位</text>
    <text x="233" y="351" font-size="10.5" fill="#6d28d9">→ 方案书 · 空容器</text>
    <text x="233" y="367" font-size="10.5" fill="#6d28d9">→ 一个别人能 clone 的仓库</text>
  </g>

  <!-- ===== 3 开赛后 ===== -->
  <g font-family="sans-serif">
    <circle cx="502" cy="104" r="13" fill="#d97706"/>
    <text x="502" y="109" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <rect x="414" y="120" width="176" height="280" rx="11" fill="#fffbeb" stroke="#fde68a"/>
    <text x="424" y="199" font-size="14" font-weight="700" fill="#111827">开赛后</text>
    <text x="424" y="217" font-size="10.5" fill="#6b7280">O 点 → F 点</text>
    <text x="424" y="243" font-size="12" fill="#1f2937"><tspan font-weight="700" fill="#d97706">05</tspan><tspan dx="6">构建与验收</tspan></text>
    <text x="424" y="267" font-size="12" fill="#1f2937"><tspan font-weight="700" fill="#d97706">10</tspan><tspan dx="6">发布与部署</tspan></text>
    <text x="424" y="299" font-size="10.5" fill="#b45309">→ 能跑的 demo</text>
    <text x="424" y="315" font-size="10.5" fill="#b45309">→ 别人机器能打开的地址</text>
  </g>

  <!-- ===== 4 收口 ===== -->
  <g font-family="sans-serif">
    <circle cx="693" cy="104" r="13" fill="#dc2626"/>
    <text x="693" y="109" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <rect x="605" y="120" width="176" height="280" rx="11" fill="#fef2f2" stroke="#fecaca"/>
    <text x="615" y="187" font-size="14" font-weight="700" fill="#111827">收口 · 提交</text>
    <text x="615" y="205" font-size="10.5" fill="#6b7280">F 点 → 提交 · 只修不加</text>
    <text x="615" y="231" font-size="12" fill="#1f2937"><tspan font-weight="700" fill="#dc2626">06</tspan><tspan dx="6">叙事交付</tspan></text>
    <text x="615" y="255" font-size="12" fill="#1f2937"><tspan font-weight="700" fill="#dc2626">15</tspan><tspan dx="6">提交整理</tspan></text>
    <text x="615" y="279" font-size="12" fill="#1f2937"><tspan font-weight="700" fill="#dc2626">17</tspan><tspan dx="6">README 门面</tspan></text>
    <text x="615" y="311" font-size="10.5" fill="#b91c1c">→ 路演稿 · 项目结构文档</text>
    <text x="615" y="327" font-size="10.5" fill="#b91c1c">→ 提交包（清正补验锁点）</text>
  </g>

  <!-- ===== 5 赛后 ===== -->
  <g font-family="sans-serif">
    <circle cx="884" cy="104" r="13" fill="#059669"/>
    <text x="884" y="109" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <rect x="796" y="120" width="176" height="280" rx="11" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="806" y="211" font-size="14" font-weight="700" fill="#111827">赛后</text>
    <text x="806" y="229" font-size="10.5" fill="#6b7280">提交后 48 小时</text>
    <text x="806" y="255" font-size="12" fill="#1f2937"><tspan font-weight="700" fill="#059669">16</tspan><tspan dx="6">赛后复盘</tspan></text>
    <text x="806" y="287" font-size="10.5" fill="#047857">→ 复盘四层</text>
    <text x="806" y="303" font-size="10.5" fill="#047857">→ 下一场直接起跑</text>
  </g>

  <!-- ===== 横贯全程 ===== -->
  <g font-family="sans-serif">
    <rect x="32" y="416" width="940" height="90" rx="11" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="7 5"/>
    <text x="46" y="443" font-size="14" font-weight="700" fill="#334155">全程横贯 · 任何时候都可能用到</text>
    <text x="46" y="462" font-size="10.5" fill="#64748b">这四份不按时间归：评分表可能开赛后第 29 小时才到，协作从第 1 天就得有——塞进某一格，那一格之外就会漏。</text>
    <text x="46" y="489" font-size="12.5" fill="#1f2937"><tspan font-weight="700" fill="#475569">12</tspan><tspan dx="5">评分表迟到</tspan><tspan dx="16" fill="#94a3b8">·</tspan><tspan dx="16" font-weight="700" fill="#475569">18</tspan><tspan dx="5">打分</tspan><tspan dx="16" fill="#94a3b8">·</tspan><tspan dx="16" font-weight="700" fill="#475569">11</tspan><tspan dx="5">真实赛程校准</tspan><tspan dx="16" fill="#94a3b8">·</tspan><tspan dx="16" font-weight="700" fill="#475569">07</tspan><tspan dx="5">协作机制</tspan><tspan dx="24" fill="#94a3b8">← 四个 agent 之间没有通道，只能靠文件</tspan></text>
  </g>
</svg>
