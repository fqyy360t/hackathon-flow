<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-label="三种评分卡对应三种打分输出">
  <rect width="1100" height="520" fill="#ffffff"/>

  <text x="40" y="46" font-family="sans-serif" font-size="24" font-weight="700" fill="#111827">同一件事，三种卡，三种输出</text>
  <text x="40" y="76" font-family="sans-serif" font-size="14" fill="#6b7280">分是从卡上算出来的。卡不在时算出来的不是分，是排序——所以不能说成同一件事。</text>

  <!-- 列 1：官方完整卡 -->
  <g font-family="sans-serif">
    <rect x="40" y="112" width="300" height="300" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="60" y="140" font-size="11.5" font-weight="700" fill="#6b7280">情况 ①</text>
    <text x="60" y="168" font-size="17" font-weight="700" fill="#14532d">有官方完整卡</text>
    <text x="60" y="192" font-size="12" fill="#4b5563">5 项 + 权重 + 每档细则</text>
    <text x="60" y="210" font-size="12" fill="#4b5563">（形态 A / C / D）</text>
    <line x1="60" y1="228" x2="320" y2="228" stroke="#bbf7d0"/>
    <text x="60" y="250" font-size="11" font-weight="700" fill="#6b7280">能 输 出</text>
    <text x="60" y="274" font-size="12.5" fill="#1f2937">· 各项得分（0–5，整数）</text>
    <text x="60" y="298" font-size="12.5" fill="#1f2937">· 加权区间（如 72–82）</text>
    <text x="60" y="322" font-size="12.5" fill="#1f2937">· 比上一轮涨没涨</text>
    <line x1="60" y1="340" x2="320" y2="340" stroke="#bbf7d0"/>
    <rect x="60" y="352" width="260" height="28" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="72" y="371" font-size="11.5" fill="#166534">预估分 · 自评 · 非官方</text>
    <text x="60" y="400" font-size="11.5" fill="#b91c1c">不给：对外引用这个数字</text>

    <!-- 列 2：只有维度名 -->
    <rect x="400" y="112" width="300" height="300" rx="10" fill="#fffbeb" stroke="#fde68a"/>
    <text x="420" y="140" font-size="11.5" font-weight="700" fill="#6b7280">情况 ②</text>
    <text x="420" y="168" font-size="17" font-weight="700" fill="#92400e">只有维度名，没权重</text>
    <text x="420" y="192" font-size="12" fill="#4b5563">四五个项的名字</text>
    <text x="420" y="210" font-size="12" fill="#4b5563">（形态 B，或"仅供参考"）</text>
    <line x1="420" y1="228" x2="680" y2="228" stroke="#fde68a"/>
    <text x="420" y="250" font-size="11" font-weight="700" fill="#6b7280">能 输 出</text>
    <text x="420" y="274" font-size="12.5" fill="#1f2937">· 各项得分</text>
    <text x="420" y="298" font-size="12.5" fill="#1f2937">· 三因子否决</text>
    <text x="420" y="322" font-size="12.5" fill="#1f2937">· 最弱一项 + 今晚的动作</text>
    <line x1="420" y1="340" x2="680" y2="340" stroke="#fde68a"/>
    <rect x="420" y="352" width="260" height="28" rx="6" fill="#ffffff" stroke="#fcd34d"/>
    <text x="432" y="371" font-size="11.5" fill="#92400e">预估分 · 等权假设</text>
    <text x="420" y="400" font-size="11.5" fill="#b91c1c">不给：加权总分、砍掉任何一项</text>

    <!-- 列 3：什么都没有 -->
    <rect x="760" y="112" width="300" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="780" y="140" font-size="11.5" font-weight="700" fill="#6b7280">情况 ③</text>
    <text x="780" y="168" font-size="17" font-weight="700" fill="#334155">什么都没有</text>
    <text x="780" y="192" font-size="12" fill="#4b5563">形态 E：连维度名都没给</text>
    <text x="780" y="210" font-size="12" fill="#4b5563">只能用内置通用六维卡</text>
    <line x1="780" y1="228" x2="1040" y2="228" stroke="#cbd5e1"/>
    <text x="780" y="250" font-size="11" font-weight="700" fill="#6b7280">能 输 出</text>
    <text x="780" y="274" font-size="12.5" fill="#1f2937">· 相对排序（A &gt; B，附依据）</text>
    <text x="780" y="298" font-size="12.5" fill="#1f2937">· 最弱一项 + 今晚的动作</text>
    <text x="780" y="322" font-size="12.5" fill="#1f2937">· 每一维的 0–5 分</text>
    <line x1="780" y1="340" x2="1040" y2="340" stroke="#cbd5e1"/>
    <rect x="780" y="352" width="260" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="792" y="371" font-size="11.5" fill="#334155">模拟分 · 无评分卡</text>
    <text x="780" y="400" font-size="11.5" fill="#b91c1c">不给：加权总分、名次预测</text>
  </g>

  <!-- 底部：三条硬规矩 -->
  <rect x="40" y="436" width="1020" height="56" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="60" y="459" font-family="sans-serif" font-size="12" font-weight="700" fill="#374151">三条硬规矩（三张卡都适用）</text>
  <text x="60" y="480" font-family="sans-serif" font-size="12" fill="#4b5563">① 没卡就不算加权总分　② 每次都说"这是自评，不代表评委判分"　③ 只打今晚还能改的维度——打完不产生动作的分，只消耗情绪</text>

  <text x="40" y="512" font-family="sans-serif" font-size="10.5" fill="#9ca3af">分只在本场内部可比。跨比赛比分数没有意义：权重与评委口径都不是同一套。</text>
</svg>
